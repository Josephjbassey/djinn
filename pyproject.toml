[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "djinn-ui"
version = "0.1.12"
description = "A shadcn-style CLI for adding pre-styled Tailwind CSS components into Django."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Joseph John", email = "josephjbassey@gmail.com"}
]
keywords = ["django", "shadcn", "components", "cli", "frontend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.7",
    "tabulate>=0.9.0",
    "requests>=2.31.0",
    "tailwind-merge>=0.3.3",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-django>=4.0",
]

[project.urls]
Homepage = "https://github.com/josephjbassey/djinn"
Repository = "https://github.com/josephjbassey/djinn"
"Bug Tracker" = "https://github.com/josephjbassey/djinn/issues"

[project.scripts]
djinn = "djinn.cli.main:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["djinn*"]

[tool.setuptools.package-data]
djinn = ["registry/**/*"]
