[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "djinn"
version = "0.1.0"
description = "A shadcn-style component installer for Django."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Djinn Team", email = "hello@djinn.dev"}
]
keywords = ["django", "shadcn", "components", "cli", "frontend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.4.1",
    "tabulate>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/djinn-dev/djinn"
Repository = "https://github.com/djinn-dev/djinn"
"Bug Tracker" = "https://github.com/djinn-dev/djinn/issues"

[project.scripts]
djinn = "djinn.cli.main:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["djinn*"]

[tool.setuptools.package-data]
djinn = ["registry/**/*"]
