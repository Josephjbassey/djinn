[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "djinn"
version = "0.1.0"
description = "A shadcn-style component installer for Django."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "tabulate>=0.8.9",
]

[project.scripts]
djinn = "djinn.cli.main:cli"

[tool.setuptools.packages.find]
include = ["djinn*"]
