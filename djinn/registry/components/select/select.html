<div class="relative">
    <select
        name="{{ name }}"
        id="{% firstof id name %}"
        {% if disabled %}disabled{% endif %}
        class="flex h-10 w-full appearance-none rounded-md border border-input bg-background px-3 py-2 pr-10 text-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 {{ class }}"
        {{ attrs|safe }}
    >
        {% if placeholder %}
            <option value="" disabled selected>{{ placeholder }}</option>
        {% endif %}
        {{ slot|safe }}
    </select>
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-muted-foreground">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
    </div>
</div>
