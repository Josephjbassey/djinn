<div
    x-data="{ show: false }"
    @open-sheet.window="if ($event.detail.id === '{{ id }}') show = true"
    @close-sheet.window="if ($event.detail.id === '{{ id }}') show = false"
    class="relative z-50"
>
    <template x-teleport="body">
        <div
            x-show="show"
            class="fixed inset-0 z-50 flex justify-end"
            x-cloak
        >
            <!-- Overlay -->
            <div
                x-show="show"
                x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                @click="show = false"
                class="fixed inset-0 bg-background/80 backdrop-blur-sm"
            ></div>

            <!-- Content -->
            <div
                x-show="show"
                x-transition:enter="transition ease-in-out duration-300 transform"
                x-transition:enter-start="translate-x-full"
                x-transition:enter-end="translate-x-0"
                x-transition:leave="transition ease-in-out duration-300 transform"
                x-transition:leave-start="translate-x-0"
                x-transition:leave-end="translate-x-full"
                class="relative h-full w-full max-w-sm border-l bg-background p-6 shadow-lg"
            >
                <div class="flex flex-col space-y-2 text-center sm:text-left mb-4">
                    <h2 class="text-lg font-semibold text-foreground">{{ title }}</h2>
                    {% if description %}
                    <p class="text-sm text-muted-foreground">{{ description }}</p>
                    {% endif %}
                </div>

                <div class="h-full">
                    {{ slot|safe }}
                </div>

                <button
                    @click="show = false"
                    class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x h-4 w-4"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    <span class="sr-only">Close</span>
                </button>
            </div>
        </div>
    </template>
</div>
