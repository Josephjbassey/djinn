<div
    x-data="{ show: false }"
    @open-modal.window="if ($event.detail.id === '{{ id }}') show = true"
    @close-modal.window="if ($event.detail.id === '{{ id }}') show = false"
    @keydown.escape.window="show = false"
    class="relative z-50"
>
    <template x-teleport="body">
        <div
            x-show="show"
            class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6"
            x-cloak
        >
            <!-- Overlay -->
            <div
                x-show="show"
                x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                @click="show = false"
                class="fixed inset-0 bg-background/80 backdrop-blur-sm"
            ></div>

            <!-- Content -->
            <div
                x-show="show"
                x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100 scale-100"
                x-transition:leave-end="opacity-0 scale-95"
                class="relative w-full max-w-lg rounded-lg border bg-background p-6 shadow-lg sm:max-w-[425px] {{ class }}"
            >
                <div class="flex flex-col space-y-1.5 text-center sm:text-left">
                    <h2 class="text-lg font-semibold leading-none tracking-tight">{{ title }}</h2>
                    {% if description %}
                    <p class="text-sm text-muted-foreground">{{ description }}</p>
                    {% endif %}
                </div>

                <div class="py-4">
                    {{ slot|safe }}
                </div>

                {% if footer %}
                <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2">
                    {{ footer|safe }}
                </div>
                {% endif %}

                <button
                    @click="show = false"
                    class="absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none data-[state=open]:bg-accent data-[state=open]:text-muted-foreground"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x h-4 w-4"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    <span class="sr-only">Close</span>
                </button>
            </div>
        </div>
    </template>
</div>
