<div class="grid w-full max-w-sm items-center gap-1.5">
    {% if label %}
    <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" {% if id %}for="{{ id }}"{% endif %}>
        {{ label }}
    </label>
    {% endif %}

    <input
        type="{{ type|default:'text' }}"
        {% if name %}name="{{ name }}"{% endif %}
        {% if id %}id="{{ id }}"{% endif %}
        placeholder="{{ placeholder }}"
        value="{{ value }}"
        {% if disabled %}disabled{% endif %}
        {% if required %}required{% endif %}
        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50
        {% if error %}border-destructive{% endif %} {{ class }}"
        {{ attrs|safe }}
    >

    {% if error %}
    <p class="text-sm font-medium text-destructive">{{ error }}</p>
    {% elif help_text %}
    <p class="text-sm text-muted-foreground">{{ help_text }}</p>
    {% endif %}
</div>
