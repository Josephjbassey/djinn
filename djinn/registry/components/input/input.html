<div class="form-field w-full max-w-sm items-center gap-1.5 {{ class }}">
    {% if label %}
    <label{% if id %} for="{{ id }}"{% endif %} class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70"{% if required %} aria-required="true"{% endif %}>
        {{ label }}
    </label>
    {% endif %}

    <input
        type="{{ type|default:'text' }}"
        {% if name %}name="{{ name }}"{% endif %}
        {% if id %}id="{{ id }}"{% endif %}
        placeholder="{{ placeholder }}"
        value="{{ value }}"
        {% if disabled %}disabled aria-disabled="true"{% endif %}
        {% if required %}required{% endif %}
        {% if error %}aria-invalid="true" aria-describedby="{{ id }}-error"{% elif help_text %}aria-describedby="{{ id }}-help"{% endif %}
        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 {% if error %}border-destructive{% endif %} {{ class }}"
        {{ attrs }}
    >

    {% if error %}
    <p id="{{ id }}-error" class="mt-1 text-sm font-medium text-destructive" role="alert">{{ error }}</p>
    {% elif help_text %}
    <p id="{{ id }}-help" class="mt-1 text-sm text-muted-foreground">{{ help_text }}</p>
    {% endif %}
</div>
