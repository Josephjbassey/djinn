<div
    x-data="{ show: false }"
    @open-drawer.window="if ($event.detail.id === '{{ id }}') show = true"
    @close-drawer.window="if ($event.detail.id === '{{ id }}') show = false"
    class="relative z-50"
>
    <template x-teleport="body">
        <div
            x-show="show"
            class="fixed inset-0 z-50 flex items-end justify-center"
            x-cloak
        >
            <!-- Overlay -->
            <div
                x-show="show"
                x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                @click="show = false"
                class="fixed inset-0 bg-background/80 backdrop-blur-sm"
            ></div>

            <!-- Content -->
            <div
                x-show="show"
                x-transition:enter="transition ease-in-out duration-300 transform"
                x-transition:enter-start="translate-y-full"
                x-transition:enter-end="translate-y-0"
                x-transition:leave="transition ease-in-out duration-300 transform"
                x-transition:leave-start="translate-y-0"
                x-transition:leave-end="translate-y-full"
                class="relative w-full max-w-lg rounded-t-xl border bg-background p-6 shadow-lg"
            >
                <div class="mx-auto mb-8 h-1.5 w-12 rounded-full bg-muted"></div>

                <div class="flex flex-col space-y-1.5 text-center sm:text-left">
                    <h2 class="text-lg font-semibold leading-none tracking-tight">{{ title }}</h2>
                    {% if description %}
                    <p class="text-sm text-muted-foreground">{{ description }}</p>
                    {% endif %}
                </div>

                <div class="py-4">
                    {{ slot|safe }}
                </div>

                {% if footer %}
                <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2">
                    {{ footer|safe }}
                </div>
                {% endif %}
            </div>
        </div>
    </template>
</div>
