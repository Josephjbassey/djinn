<div
    x-data="{ show: false, message: '', type: 'default' }"
    @toast.window="message = $event.detail.message; type = $event.detail.type || 'default'; show = true; setTimeout(() => show = false, 3000)"
    class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"
>
    <template x-if="show">
        <div
            x-show="show"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="group pointer-events-auto relative flex w-full items-center justify-between space-x-4 overflow-hidden rounded-md border p-6 pr-8 shadow-lg transition-all
            :class="type === 'destructive' ? 'destructive group border-destructive bg-destructive text-destructive-foreground' : 'border bg-background text-foreground'"
        >
            <div class="grid gap-1">
                <p x-text="message" class="text-sm font-semibold"></p>
            </div>
            <button @click="show = false" class="absolute right-2 top-2 rounded-md p-1 text-foreground/50 opacity-0 transition-opacity hover:text-foreground focus:opacity-100 focus:outline-none focus:ring-2 group-hover:opacity-100">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
    </template>
</div>
