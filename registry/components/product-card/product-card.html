<div class="group relative rounded-lg border bg-card text-card-foreground shadow-sm overflow-hidden {{ class }}">
    <div class="aspect-square overflow-hidden bg-muted">
        <img
            src="{{ image_url }}"
            alt="{{ name }}"
            class="h-full w-full object-cover transition-transform group-hover:scale-105"
        >
    </div>
    <div class="p-4">
        <h3 class="text-sm font-semibold">{{ name }}</h3>
        <p class="mt-1 text-sm text-muted-foreground">{{ category }}</p>
        <div class="mt-4 flex items-center justify-between">
            <span class="text-sm font-bold">{{ price }}</span>
            {% include "components/button.html" with label="Add" size="sm" variant="outline" %}
        </div>
    </div>
</div>
