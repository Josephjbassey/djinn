<div class="rounded-lg border bg-card text-card-foreground shadow-sm p-6 flex flex-col items-center text-center {{ class }}">
    <div class="relative flex h-20 w-20 shrink-0 overflow-hidden rounded-full mb-4">
        {% if avatar_url %}
            <img class="aspect-square h-full w-full" src="{{ avatar_url }}" alt="{{ name }}">
        {% else %}
            <div class="flex h-full w-full items-center justify-center rounded-full bg-muted font-bold text-xl">
                {{ name|slice:":1" }}
            </div>
        {% endif %}
    </div>
    <h3 class="text-lg font-semibold">{{ name }}</h3>
    <p class="text-sm text-muted-foreground mb-4">{{ role }}</p>
    <div class="flex gap-2">
        {{ slot|safe }}
    </div>
</div>
