<div class="grid gap-4 md:gap-6 lg:gap-8
    {% if cols == '2' %}grid-cols-1 md:grid-cols-2
    {% elif cols == '3' %}grid-cols-1 md:grid-cols-2 lg:grid-cols-3
    {% elif cols == '4' %}grid-cols-1 md:grid-cols-2 lg:grid-cols-4
    {% else %}grid-cols-1{% endif %}
    {{ class }}"
>
    {{ slot|safe }}
</div>
