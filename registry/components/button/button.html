<button
    type="{{ type|default:'button' }}"
    {% if disabled %}disabled{% endif %}
    class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50
    {% if variant == 'secondary' %}bg-secondary text-secondary-foreground hover:bg-secondary/80
    {% elif variant == 'destructive' %}bg-destructive text-destructive-foreground hover:bg-destructive/90
    {% elif variant == 'outline' %}border border-input bg-background hover:bg-accent hover:text-accent-foreground
    {% elif variant == 'ghost' %}hover:bg-accent hover:text-accent-foreground
    {% elif variant == 'link' %}text-primary underline-offset-4 hover:underline
    {% else %}bg-primary text-primary-foreground hover:bg-primary/90{% endif %}
    {% if size == 'sm' %}h-9 px-3
    {% elif size == 'lg' %}h-11 px-8
    {% elif size == 'icon' %}h-10 w-10
    {% else %}h-10 px-4 py-2{% endif %}
    {{ class }}"
    {{ attrs|safe }}
>
    {% if icon_left %}<span class="mr-2">{{ icon_left|safe }}</span>{% endif %}
    {{ label|default:slot }}
    {% if icon_right %}<span class="ml-2">{{ icon_right|safe }}</span>{% endif %}
</button>
