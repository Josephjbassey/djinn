<div x-data="{ show: false }" class="relative inline-block {{ class }}">
    <div
        @mouseenter="show = true"
        @mouseleave="show = false"
        @focusin="show = true"
        @focusout="show = false"
    >
        {{ slot|safe }}
    </div>
    <div
        x-show="show"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
        class="absolute z-50 px-3 py-1.5 text-xs font-medium text-popover-foreground bg-popover rounded border shadow-md -top-10 left-1/2 -translate-x-1/2 whitespace-nowrap"
        x-cloak
    >
        {{ content }}
        <div class="absolute w-2 h-2 bg-popover border-b border-r rotate-45 left-1/2 -translate-x-1/2 -bottom-1"></div>
    </div>
</div>
